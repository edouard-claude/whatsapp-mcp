name: whatsmeow

# WhatsApp fait évoluer son protocole sans prévenir : un whatsmeow en retard finit
# par produire des messages que les clients jugent « d'une ancienne version ».
# Chaque lundi, monte whatsmeow à son dernier commit, recopie ses .proto et ouvre
# une PR ; la CI de la PR dit si l'API a changé.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - run: make update-whatsmeow
      - id: version
        run: echo "value=$(cat proto/whatsmeow/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: deps/whatsmeow
          commit-message: "whatsmeow ${{ steps.version.outputs.value }}"
          title: "whatsmeow ${{ steps.version.outputs.value }}"
          body: |
            Montée automatique de whatsmeow au dernier commit, avec ses `.proto` recopiés.
            Si la CI échoue, l'API de whatsmeow a changé : corriger le bridge sur cette branche.
          delete-branch: true
