[package]
name = "wa-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Full-featured WhatsApp MCP server (Rust), backed by a whatsmeow bridge (Go)"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
getrandom = "0.4.3"
jiff = "0.2.37"
parking_lot = "0.12.5"
prost = "0.14.4"
qrcode = { version = "0.14.1", default-features = false }
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
wa-proto = { path = "../wa-proto" }
